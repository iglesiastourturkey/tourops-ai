kind = "web"
previewPath = "/"
title = "TourOps AI"
version = "1.0.0"
id = "artifacts/tourops-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20361

[services.development]
run = "pnpm --filter @workspace/tourops-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tourops-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/tourops-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20361"
BASE_PATH = "/"
