<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Navy rounded-square background -->
  <rect width="40" height="40" rx="9" fill="#0B1F3A"/>
  <!-- Subtle compass ring -->
  <circle cx="20" cy="20" r="13" stroke="#F97316" stroke-width="1" fill="none" opacity="0.35"/>
  <!-- Route line: origin (bottom-left) → destination (top-right) -->
  <path d="M11.5 28.5 L20 20 L28.5 11.5" stroke="#F97316" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Destination pin -->
  <circle cx="28.5" cy="11.5" r="3.2" fill="#F97316"/>
  <!-- Inner destination dot -->
  <circle cx="28.5" cy="11.5" r="1.4" fill="white"/>
  <!-- Origin dot -->
  <circle cx="11.5" cy="28.5" r="2" fill="white" opacity="0.6"/>
</svg>
