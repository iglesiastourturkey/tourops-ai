openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TourOps AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profiles
    description: User profile operations
  - name: customers
    description: Customer management
  - name: suppliers
    description: Supplier management
  - name: tours
    description: Tour package management
  - name: quotations
    description: Quotation management
  - name: operations
    description: Operations tracking
  - name: notifications
    description: Notification center
  - name: exchange-rates
    description: Exchange rate management
  - name: agency-settings
    description: Agency settings
  - name: email-templates
    description: Email template management
  - name: dashboard
    description: Dashboard data
  - name: ai
    description: AI assistant operations
  - name: storage
    description: Object storage upload and serving endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── PROFILES ────────────────────────────────────────────────────────────
  /profiles/me:
    get:
      operationId: getMyProfile
      tags: [profiles]
      summary: Get current user profile
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMyProfile
      tags: [profiles]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      summary: List user profiles (admin sees all; operations sees guides only)
      parameters:
        - name: role
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: List of profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"

  # ─── CUSTOMERS ───────────────────────────────────────────────────────────
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List all customers
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: customerType
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted

  # ─── SUPPLIERS ───────────────────────────────────────────────────────────
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List all suppliers
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: isActive
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: List of suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Create a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Created supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
  /suppliers/{id}:
    get:
      operationId: getSupplier
      tags: [suppliers]
      summary: Get a supplier by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "404":
          description: Not found
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update a supplier
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierUpdate"
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
    delete:
      operationId: deleteSupplier
      tags: [suppliers]
      summary: Delete a supplier
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted

  # ─── TOURS ───────────────────────────────────────────────────────────────
  /tours:
    get:
      operationId: listTours
      tags: [tours]
      summary: List all tours
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: number }
      responses:
        "200":
          description: List of tours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tour"
    post:
      operationId: createTour
      tags: [tours]
      summary: Create a tour
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourInput"
      responses:
        "201":
          description: Created tour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"
  /tours/{id}:
    get:
      operationId: getTour
      tags: [tours]
      summary: Get a tour with days, activities, and costs
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Full tour detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourDetail"
        "404":
          description: Not found
    patch:
      operationId: updateTour
      tags: [tours]
      summary: Update a tour
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourUpdate"
      responses:
        "200":
          description: Updated tour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"
    delete:
      operationId: deleteTour
      tags: [tours]
      summary: Delete a tour
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
  /tours/{id}/cost-summary:
    get:
      operationId: computeTourCostSummary
      tags: [tours]
      summary: Get calculated cost summary for a tour
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Cost summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourCostSummary"
  /tours/{id}/days:
    get:
      operationId: listTourDays
      tags: [tours]
      summary: List tour days
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: List of tour days
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TourDay"
    post:
      operationId: createTourDay
      tags: [tours]
      summary: Add a day to a tour
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourDayInput"
      responses:
        "201":
          description: Created tour day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourDay"
  /tours/{id}/days/{dayId}:
    patch:
      operationId: updateTourDay
      tags: [tours]
      summary: Update a tour day
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
        - name: dayId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourDayUpdate"
      responses:
        "200":
          description: Updated tour day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourDay"
    delete:
      operationId: deleteTourDay
      tags: [tours]
      summary: Delete a tour day
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
        - name: dayId
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
  /tours/{id}/costs:
    get:
      operationId: listTourCosts
      tags: [tours]
      summary: List cost items for a tour
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: List of cost items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TourCost"
    post:
      operationId: createTourCost
      tags: [tours]
      summary: Add a cost item to a tour
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourCostInput"
      responses:
        "201":
          description: Created cost item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourCost"
  /tours/{id}/costs/{costId}:
    patch:
      operationId: updateTourCost
      tags: [tours]
      summary: Update a cost item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
        - name: costId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TourCostUpdate"
      responses:
        "200":
          description: Updated cost item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourCost"
    delete:
      operationId: deleteTourCost
      tags: [tours]
      summary: Delete a cost item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
        - name: costId
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted

  # ─── QUOTATIONS ──────────────────────────────────────────────────────────
  /quotations:
    get:
      operationId: listQuotations
      tags: [quotations]
      summary: List all quotations
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: number }
      responses:
        "200":
          description: List of quotations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quotation"
    post:
      operationId: createQuotation
      tags: [quotations]
      summary: Create a quotation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotationInput"
      responses:
        "201":
          description: Created quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
  /quotations/{id}:
    get:
      operationId: getQuotation
      tags: [quotations]
      summary: Get a quotation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Quotation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationDetail"
        "404":
          description: Not found
    patch:
      operationId: updateQuotation
      tags: [quotations]
      summary: Update a quotation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotationUpdate"
      responses:
        "200":
          description: Updated quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
    delete:
      operationId: deleteQuotation
      tags: [quotations]
      summary: Delete a quotation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
  /quotations/{id}/status:
    patch:
      operationId: updateQuotationStatus
      tags: [quotations]
      summary: Update quotation status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotationStatusUpdate"
      responses:
        "200":
          description: Updated quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
  /quotations/{id}/duplicate:
    post:
      operationId: duplicateQuotation
      tags: [quotations]
      summary: Duplicate a quotation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "201":
          description: Duplicated quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
  /quotations/{id}/convert-to-operation:
    post:
      operationId: convertQuotationToOperation
      tags: [quotations]
      summary: Convert accepted quotation to operation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "201":
          description: Created operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"

  # ─── OPERATIONS ──────────────────────────────────────────────────────────
  /operations:
    get:
      operationId: listOperations
      tags: [operations]
      summary: List all operations
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of operations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Operation"
    post:
      operationId: createOperation
      tags: [operations]
      summary: Create an operation manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationInput"
      responses:
        "201":
          description: Created operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
  /operations/{id}:
    delete:
      operationId: deleteOperation
      tags: [operations]
      summary: Delete an operation and all its tasks and receipts
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
        "409":
          description: Conflict
    get:
      operationId: getOperation
      tags: [operations]
      summary: Get operation with tasks
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Operation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationDetail"
        "404":
          description: Not found
    patch:
      operationId: updateOperation
      tags: [operations]
      summary: Update an operation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationUpdate"
      responses:
        "200":
          description: Updated operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
  /operations/{id}/tasks:
    get:
      operationId: listOperationTasks
      tags: [operations]
      summary: List tasks for an operation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationTask"
    post:
      operationId: createOperationTask
      tags: [operations]
      summary: Create a task for an operation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationTaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationTask"
  /operations/{id}/tasks/{taskId}:
    patch:
      operationId: updateOperationTask
      tags: [operations]
      summary: Update an operation task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
        - name: taskId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationTaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationTask"
    delete:
      operationId: deleteOperationTask
      tags: [operations]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
        - name: taskId
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted

  /operations/{id}/receipts:
    get:
      operationId: listOperationReceipts
      tags: [operations]
      summary: List expense receipts for an operation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: List of receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationReceipt"
    post:
      operationId: createOperationReceipt
      tags: [operations]
      summary: Add an expense receipt to an operation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationReceiptInput"
      responses:
        "201":
          description: Created receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationReceipt"

  /operations/{id}/receipts/{receiptId}:
    delete:
      operationId: deleteOperationReceipt
      tags: [operations]
      summary: Delete a receipt and its storage object
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
        - name: receiptId
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ─── GMAIL RESERVATIONS ───────────────────────────────────────────────────
  /reservations/google-connection:
    get:
      operationId: getGoogleReservationConnection
      tags: [reservations]
      summary: Get Google Workspace Gmail connection status
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleConnectionStatus" }
    delete:
      operationId: disconnectGoogleReservationConnection
      tags: [reservations]
      summary: Disconnect the Google Workspace Gmail account
      responses:
        "204": { description: Disconnected }
  /reservations/google-connection/authorize:
    post:
      operationId: authorizeGoogleReservationConnection
      tags: [reservations]
      summary: Create a Google OAuth authorization URL
      responses:
        "200":
          description: Authorization URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleAuthorization" }
  /reservations/google-connection/callback:
    get:
      operationId: completeGoogleReservationAuthorization
      tags: [reservations]
      summary: Google OAuth callback
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302": { description: Redirects to the configured success page }
  /reservations/scan:
    post:
      operationId: scanReservationMailbox
      tags: [reservations]
      summary: Manually scan messages marked with the TourPilot Gmail label
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationScanResult" }
  /reservations:
    get:
      operationId: listReservationImports
      tags: [reservations]
      summary: List imported reservation emails
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Reservation imports
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReservationImport" }
  /reservations/{id}:
    get:
      operationId: getReservationImport
      tags: [reservations]
      summary: Get an imported email and its extraction
      parameters:
        - $ref: "#/components/parameters/ReservationImportId"
      responses:
        "200":
          description: Reservation import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationImportDetail" }
        "404": { description: Not found }
  /reservations/{id}/analyze:
    post:
      operationId: analyzeReservationImport
      tags: [reservations]
      summary: Extract structured reservation data with AI
      parameters:
        - $ref: "#/components/parameters/ReservationImportId"
      responses:
        "200":
          description: Validated AI extraction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationAnalysis" }
  /reservations/{id}/review:
    patch:
      operationId: reviewReservationImport
      tags: [reservations]
