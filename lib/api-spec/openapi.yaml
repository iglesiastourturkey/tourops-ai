components:
  parameters:
    ReservationImportId:
      name: id
      in: path
      required: true
      schema: { type: number }
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    SuccessResponse:
      type: object
      properties:
        success: { type: boolean }
      required: [success]

    # ── Profiles ────────────────────────────────────────────────────────
    Profile:
      type: object
      properties:
        id: { type: number }
        clerkUserId: { type: string }
        email: { type: string }
        name: { type: ["string", "null"] }
        role: { type: string, enum: [admin, operations, guide, accounting] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, clerkUserId, email, role, isActive, createdAt, updatedAt]
    ProfileUpdate:
      type: object
      properties:
        name: { type: string }

    # ── Customers ────────────────────────────────────────────────────────
    Customer:
      type: object
      properties:
        id: { type: number }
        name: { type: string }
        company: { type: ["string", "null"] }
        nationality: { type: ["string", "null"] }
        language: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        whatsapp: { type: ["string", "null"] }
        customerType: { type: string }
        travelPreferences: { type: ["string", "null"] }
        dietaryRestrictions: { type: ["string", "null"] }
        accessibilityRequirements: { type: ["string", "null"] }
        passportStatus: { type: string }
        notes: { type: ["string", "null"] }
        archivedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, customerType, passportStatus, createdAt, updatedAt]
    CustomerInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        company: { type: string }
        nationality: { type: string }
        language: { type: string }
        phone: { type: string }
        email: { type: string }
        whatsapp: { type: string }
        customerType: { type: string }
        travelPreferences: { type: string }
        dietaryRestrictions: { type: string }
        accessibilityRequirements: { type: string }
        passportStatus: { type: string }
        notes: { type: string }
      required: [name, customerType]
    CustomerUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        company: { type: string }
        nationality: { type: string }
        language: { type: string }
        phone: { type: string }
        email: { type: string }
        whatsapp: { type: string }
        customerType: { type: string }
        travelPreferences: { type: string }
        dietaryRestrictions: { type: string }
        accessibilityRequirements: { type: string }
        passportStatus: { type: string }
        notes: { type: string }
        archivedAt: { type: string, format: date-time }

    # ── Suppliers ────────────────────────────────────────────────────────
    Supplier:
      type: object
      properties:
        id: { type: number }
        name: { type: string }
        contactPerson: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        category: { type: string }
        currency: { type: string }
        taxNumber: { type: ["string", "null"] }
        bankDetails: { type: ["string", "null"] }
        paymentTerms: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        rating: { type: ["number", "null"] }
        isActive: { type: boolean }
        archivedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, category, currency, isActive, createdAt, updatedAt]
    SupplierInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        contactPerson: { type: string }
        phone: { type: string }
        email: { type: string }
        website: { type: string }
        address: { type: string }
        city: { type: string }
        category: { type: string }
        currency: { type: string }
        taxNumber: { type: string }
        bankDetails: { type: string }
        paymentTerms: { type: string }
        notes: { type: string }
        rating: { type: number }
        isActive: { type: boolean }
      required: [name, category, currency]
    SupplierUpdate:
      type: object
      properties:
        name: { type: string }
        contactPerson: { type: string }
        phone: { type: string }
